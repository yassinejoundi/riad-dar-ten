<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Riad Dar Ten desktop website preview</title>
  <desc id="desc">A browser mockup showing the Riad Dar Ten Marrakech homepage.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243b"/>
      <stop offset="0.55" stop-color="#273954"/>
      <stop offset="1" stop-color="#b96645"/>
    </linearGradient>
    <linearGradient id="heroShade" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#120b07" stop-opacity="0.35"/>
      <stop offset="0.58" stop-color="#120b07" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#120b07" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0b1424" flood-opacity="0.36"/>
    </filter>
    <clipPath id="screen">
      <rect x="150" y="190" width="1300" height="731" rx="0"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#backdrop)"/>
  <circle cx="1450" cy="120" r="250" fill="#f5f1e8" opacity="0.07"/>
  <circle cx="80" cy="910" r="280" fill="#d4a574" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="100" y="110" width="1400" height="820" rx="22" fill="#f5f1e8"/>
    <rect x="100" y="110" width="1400" height="80" rx="22" fill="#ebe4d9"/>
    <rect x="100" y="168" width="1400" height="22" fill="#ebe4d9"/>
    <circle cx="145" cy="150" r="10" fill="#c64b3c"/>
    <circle cx="178" cy="150" r="10" fill="#d4a574"/>
    <circle cx="211" cy="150" r="10" fill="#7fb8a5"/>
    <rect x="490" y="132" width="620" height="36" rx="18" fill="#f5f1e8"/>
    <text x="800" y="156" text-anchor="middle" fill="#7b756d" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.5">riad-dar-ten.vercel.app</text>

    <g clip-path="url(#screen)">
      <image href="../assets/images/home/hero-background.png" x="150" y="190" width="1300" height="731" preserveAspectRatio="xMidYMid slice"/>
      <rect x="150" y="190" width="1300" height="731" fill="url(#heroShade)"/>
      <line x1="150" y1="270" x2="1450" y2="270" stroke="#f5f1e8" stroke-opacity="0.25"/>
      <text x="210" y="248" fill="#f5f1e8" font-family="Georgia, serif" font-size="34" letter-spacing="7">DAR TEN</text>
      <text x="820" y="238" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.5">THE RIAD</text>
      <text x="950" y="238" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.5">ROOMS</text>
      <text x="1055" y="238" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.5">GALLERY</text>
      <text x="1180" y="238" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.5">CONTACT</text>
      <rect x="1310" y="214" width="105" height="42" fill="#c87553"/>
      <text x="1362" y="240" text-anchor="middle" fill="#fffaf2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">BOOK</text>

      <text x="210" y="620" fill="#f2cba8" font-family="Arial, sans-serif" font-size="13" letter-spacing="3.2">LAKSSOUR · MARRAKECH MEDINA</text>
      <text x="210" y="694" fill="#fffaf2" font-family="Georgia, serif" font-size="66">A quiet house in the</text>
      <text x="210" y="765" fill="#fffaf2" font-family="Georgia, serif" font-size="66">heart of Marrakech</text>
      <text x="212" y="812" fill="#fffaf2" fill-opacity="0.86" font-family="Arial, sans-serif" font-size="18">Six intimate rooms gathered around a tranquil courtyard.</text>
      <rect x="210" y="850" width="168" height="48" fill="#c87553"/>
      <text x="294" y="880" text-anchor="middle" fill="#fffaf2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.7">BOOK YOUR STAY</text>
    </g>
  </g>
</svg>
